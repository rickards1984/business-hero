[pytest]
# backend/tests does `from main import ...` expecting backend/main.py (the
# real FastAPI app). Without this, pytest's rootdir insertion can resolve
# `main` to the root main.py Railway entrypoint shim instead, which only
# exposes `app` — collection then fails with ImportError. Putting `backend`
# first on sys.path makes the resolution deterministic.
pythonpath = backend
testpaths = backend/tests
